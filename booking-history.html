<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ParkWise — My bookings</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />

<body class="textured-bg" data-nav="driver" data-page="bookings">
  <main>
    <h1>My bookings</h1>
    <p class="subtitle">Your past and current parking reservations.</p>
    <div class="table-scroll">
      <table class="simple stack-mobile" id="bookings-table">
        <thead><tr><th>Vehicle</th><th>Date</th><th>Time</th><th>Amount</th><th>Status</th><th></th></tr></thead>
        <tbody><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
