<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ParkWise — Reserve slot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="textured-bg" data-nav="driver" data-page="search">
  <main class="narrow">
    <h1>Reserve slot</h1>
    <p class="subtitle" id="booking-subtitle">Loading listing…</p>
    <div class="panel">
      <div class="panel-head" id="booking-title">Ticket details</div>
      <div class="panel-body">
        <form id="booking-form">
          <label for="booking-date">Date</label>
          <input type="date" id="booking-date" name="date" required />
          <div class="form-row">
            <div>
              <label for="booking-start">Start time</label>
              <input type="time" id="booking-start" name="start" required />
            </div>
            <div>
              <label for="booking-end">End time</label>
              <input type="time" id="booking-end" name="end" required />
            </div>
          </div>
          <label for="booking-vehicle">Vehicle number</label>
          <input type="text" id="booking-vehicle" name="vehicle" placeholder="UP65 AB 1234" autocomplete="off" required maxlength="15" pattern="[A-Za-z0-9][A-Za-z0-9 \-]{3,14}" title="Letters, numbers, spaces or dashes, e.g. UP65 AB 1234" style="text-transform:uppercase;" />
          <div class="form-error" id="booking-error"></div>
          <div style="margin-top:18px;">
            <button type="submit" id="booking-submit">Confirm booking</button>
            <a href="find-parking.html" class="btn secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
