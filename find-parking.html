<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ParkWise — Find parking</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/pages/find-parking.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="textured-bg" data-nav="driver" data-page="search">
  <main class="ps-main">
    <div class="ps-head">
      <h1>Nearby parking</h1>
      <p class="subtitle">Ranked by match score — distance, price, and open slots combined.</p>
    </div>

    <div class="panel ps-search">
      <div class="panel-body">
        <label for="destination-input" id="destination-label">Search a parking space or area</label>
        <div class="ps-search__row">
          <div class="ps-combo">
            <input type="text" id="destination-input" role="combobox" aria-autocomplete="list"
                   aria-expanded="false" aria-controls="ps-suggest" aria-describedby="ps-hint"
                   autocomplete="off" spellcheck="false"
                   placeholder="Space name or area, e.g. Sigra Parking, Assi Ghat" />
            <button type="button" class="ps-clear" id="ps-clear" aria-label="Clear search" hidden>&times;</button>
            <ul class="ps-suggest" id="ps-suggest" role="listbox" aria-labelledby="destination-label" hidden></ul>
          </div>
          <button type="button" id="destination-search-btn">Search</button>
        </div>
        <p class="ps-hint" id="ps-hint">Results filter as you type. Use &uarr; &darr; and Enter to pick a suggestion, Esc to close.</p>
        <div class="form-error" id="destination-error" role="alert"></div>

        <div class="ps-chips" role="group" aria-label="Quick filters">
          <div class="ps-chipgroup">
            <span class="ps-chips__label">Vehicle</span>
            <button type="button" class="ps-chip is-active" data-vehicle="">Any</button>
            <button type="button" class="ps-chip" data-vehicle="car">Car</button>
            <button type="button" class="ps-chip" data-vehicle="bike">Bike</button>
          </div>
          <span class="ps-chips__sep" aria-hidden="true"></span>
          <div class="ps-chipgroup">
            <span class="ps-chips__label">Price</span>
            <button type="button" class="ps-chip is-active" data-price="">Any</button>
            <button type="button" class="ps-chip" data-price="30">Up to ₹30</button>
            <button type="button" class="ps-chip" data-price="50">Up to ₹50</button>
          </div>
          <div class="ps-chipgroup">
            <span class="ps-chips__label">Show</span>
            <button type="button" class="ps-chip" id="chip-free" aria-pressed="false">Free slots only</button>
          </div>
        </div>

        <details class="ps-more">
          <summary>More filters</summary>
          <div class="form-row">
            <div>
              <label for="filter-max-price">Max price (₹/hr)</label>
              <input type="number" id="filter-max-price" placeholder="Any" min="0" />
            </div>
            <div>
              <label for="filter-vehicle-type">Vehicle type</label>
              <select id="filter-vehicle-type">
                <option value="">Any</option>
                <option value="car">Car</option>
                <option value="bike">Bike</option>
              </select>
            </div>
            <div class="ps-more__btn"><button type="button" id="apply-filters-btn">Apply</button></div>
          </div>
        </details>
      </div>
    </div>

    <div class="status-banner banner-loading" id="location-banner"><span class="led-dot"></span> Finding your area…</div>
    <p class="ps-count" id="ps-result-count" aria-live="polite"></p>
    <div id="listing-results"></div>
  </main>
  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/geolocation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
