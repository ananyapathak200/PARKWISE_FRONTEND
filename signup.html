<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ParkWise — Sign up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/pages/auth.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="textured-bg" data-nav="auth" data-page="signup" data-auth-href="login.html" data-auth-label="Already have an account?">
  <main class="narrow">
    <h1>Create your account</h1>
    <p class="subtitle">Book parking as a driver, or list your space as an owner.</p>
    <div class="panel">
      <div class="panel-head">Sign up</div>
      <div class="panel-body">
        <form id="signup-form">
          <label>I am a</label>
          <div class="role-picker">
            <label class="role-option selected">
              <input type="radio" name="role" value="driver" checked />
              <div class="role-label">Driver</div>
              <div class="role-desc">I want to find parking</div>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="owner" />
              <div class="role-label">Owner</div>
              <div class="role-desc">I want to list a space</div>
            </label>
          </div>
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required minlength="2" maxlength="80" />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required maxlength="254" />
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="98765 43210" autocomplete="tel" required maxlength="18" pattern="\+?[0-9][0-9 \-]{6,17}" title="Digits only, e.g. 98765 43210 or +91 98765 43210" />
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" maxlength="128" />
          <div class="form-error" id="signup-error"></div>
          <button type="submit" id="signup-btn" class="full-width auth-submit">Create account</button>
        </form>
      </div>
    </div>
    <p class="fine-print auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </main>
  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
