<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ParkWise — Edit listing</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="textured-bg" data-nav="owner" data-page="dashboard">
  <main class="narrow">
    <a href="dashboard.html" class="fine-print">&larr; Back to dashboard</a>
    <h1 style="margin-top:14px;">Edit listing</h1>
    <div id="listing-status"></div>

    <div class="panel" id="edit-body">
      <div class="panel-head" id="listing-heading">Loading…</div>
      <div class="panel-body">
        <form id="edit-listing-form" hidden>
          <label for="listing-name">Space name</label>
          <input type="text" id="listing-name" required minlength="2" maxlength="100" />
          <label for="listing-address">Address</label>
          <input type="text" id="listing-address" required minlength="3" maxlength="300" />
          <div class="form-row">
            <div><label for="listing-price">Price per hour (₹)</label><input type="number" id="listing-price" min="1" max="10000" step="1" required /></div>
            <div><label for="listing-slots">Number of slots</label><input type="number" id="listing-slots" min="1" max="200" step="1" required /></div>
          </div>
          <label for="listing-photo">Photo</label>
          <div class="photo-drop" data-photo-drop id="listing-photo-drop">
            <input type="file" id="listing-photo" class="photo-drop__input" accept="image/jpeg,image/png,image/webp" />
            <label for="listing-photo" class="photo-drop__zone">
              <span class="photo-drop__empty">
                <span class="photo-drop__icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
                <strong>Add or change the photo</strong>
                <span>Drag it here or tap to choose. JPEG, PNG or WEBP, up to 5 MB.</span>
              </span>
              <img class="photo-drop__preview" alt="Preview of the parking space photo" hidden />
            </label>
            <div class="photo-drop__bar" hidden>
              <span class="photo-drop__name"></span>
              <label for="listing-photo" class="photo-drop__change">Change</label>
              <button type="button" class="photo-drop__remove">Remove</button>
            </div>
            <p class="photo-drop__error" role="alert"></p>
          </div>
          <div class="form-error" id="edit-error"></div>
          <div class="callout callout-go" id="edit-success" hidden></div>
          <div style="margin-top:18px;">
            <button type="submit" id="save-btn">Save changes</button>
            <a href="slot-status.html" class="btn secondary" id="slots-link">View slots</a>
            <button type="button" class="danger" id="delete-listing-btn">Delete listing</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/geolocation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/photo-drop.js"></script>
  <script src="js/edit-listing.js"></script>
</body>
</html>
