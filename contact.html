<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css" />

<body class="textured-bg" data-nav="public" data-page="contact">
  <main class="static-page">
    <span class="static-eyebrow">Contact</span>
    <h1>We're here to help.</h1>
    <p class="static-lead">Questions about a booking, a listing or your account? Send us an email.</p>
    <div class="panel"><div class="panel-body contact-card">
      <span class="contact-card__icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
      <div>
        <a href="mailto:support@parkwise.com" class="contact-mail">support@parkwise.com</a>
        <p class="fine-print" style="margin:4px 0 0;">Include your booking or listing name if you have one — it helps us answer faster.</p>
      </div>
    </div></div>
  </main>
  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
