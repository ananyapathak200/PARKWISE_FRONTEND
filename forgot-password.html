<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ParkWise — Forgot password</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/pages/auth.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="textured-bg" data-nav="auth" data-page="login" data-auth-href="login.html" data-auth-label="Back to login">
  <main class="auth-split">
    <section class="auth-form">
    <h1>Forgot your password?</h1>
    <p class="subtitle">Enter the email you signed up with and we'll send you a link to reset it.</p>
    <div class="panel">
      <div class="panel-head">Reset password</div>
      <div class="panel-body" id="forgot-body">
        <form id="forgot-form">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required maxlength="254" />
          <div class="form-error" id="forgot-error"></div>
          <button type="submit" id="forgot-btn" class="full-width auth-submit">Send reset link</button>
        </form>
      </div>
    </div>
    <p class="fine-print auth-foot">Remembered it? <a href="login.html">Back to login</a></p>
    </section>
    <aside class="auth-art" aria-hidden="true">
      <div class="auth-art__inner">
        <h2>Park smarter with <span>ParkWise</span></h2>
        <p>Find, book and park in a few taps.</p>
      </div>
    </aside>
  </main>
  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
